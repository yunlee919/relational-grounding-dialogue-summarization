[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-semantic-pipeline"
version = "0.1.0"
description = "Reproducible pipeline for relational grounding analysis in zero-shot cross-lingual dialogue summarization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "bert-score>=0.3.13",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "rouge-score>=0.1.2",
  "seaborn>=0.13",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]
